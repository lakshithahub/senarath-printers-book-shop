<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced POS - Senarath Printers</title>
    
    <!-- jQuery සහ Font Awesome (Icons සඳහා) සම්බන්ධ කිරීම -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #090b11;
            --card-bg: #151926;
            --accent-yellow: #ffcc00;
            --accent-glow: rgba(255, 204, 0, 0.3);
            --text-main: #f0f0f0;
            --text-dim: #94a3b8;
            --border-color: #2d3142;
            --input-bg: #1e2533;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main);
            padding: 0; 
            margin: 0;
            line-height: 1.6;
        }

        /* ----- මෙනු එකේ ස්ටයිල් (Navigation Styles) ----- */
        .sidebar {
            width: 250px;
            background: var(--card-bg);
            height: 100vh;
            position: fixed;
            border-right: 1px solid var(--border-color);
            padding: 20px;
        }

        .logo-area {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-yellow);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
        }

        .menu-item {
            margin-bottom: 10px;
        }

        /* Dashboard ලින්ක් එකේ පෙනුම */
        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu-link:hover {
            background: var(--accent-glow);
            color: var(--accent-yellow);
        }

        .menu-link.active {
            background: var(--accent-yellow);
            color: var(--bg-dark);
            font-weight: bold;
        }

        /* ප්‍රධාන කොටස (Main Content) */
        .main-content {
            margin-left: 270px;
            padding: 30px;
        }

        .container { max-width: 1200px; margin: auto; }
        
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 { color: var(--accent-yellow); }
    </style>
</head>
<body>

    <!-- [START] මෙතන ඉඳන් තමයි Dashboard එකට යන Sidebar මෙනු එක තියෙන්නේ -->
    <div class="sidebar">
        <div class="logo-area">
            <i class="fas fa-print"></i> Senarath Printers
        </div>

        <ul class="menu-list">
            <!-- Dashboard ලින්ක් එක - මෙන්න මේක තමයි ප්‍රධාන ලින්ක් එක -->
            <li class="menu-item">
                <a href="README.md" class="menu-link active">
                    <i class="fas fa-home"></i> Dashboard
                </a>
            </li>
            
            <li class="menu-item">
                <a href="inventory.html" class="menu-link">
                    <i class="fas fa-box"></i> Inventory
                </a>
            </li>

            <li class="menu-item">
                <a href="sales.html" class="menu-link">
                    <i class="fas fa-shopping-cart"></i> Sales (විකුණුම්)
                </a>
            </li>

            <li class="menu-item">
                <a href="reports.html" class="menu-link">
                    <i class="fas fa-file-invoice"></i> Reports (වාර්තා)
                </a>
            </li>
        </ul>
    </div>
    <!-- [END] Sidebar මෙනු එක අවසානය -->

    <div class="main-content">
        <div class="container">
            <!-- Header කොටස -->
            <div class="header-section">
                <h1>Advanced POS System</h1>
                <div class="user-info">
                    <i class="fas fa-user-circle"></i> Lakshitha
                </div>
            </div>

            <!-- මෙතන ඉඳන් ඔබේ අනෙකුත් Dashboard විස්තර දාන්න පුළුවන් -->
            <div style="margin-top: 40px;">
                <h3>Dashboard Overview</h3>
                <p style="color: var(--text-dim);">Senarath Printers POS පද්ධතියට සාදරයෙන් පිළිගනිමු.</p>
            </div>
        </div>
    </div>

    <script>
        // පිටුව Load වූ පසු වැඩ කරන කොටස
        $(document).ready(function() {
            console.log("POS System Ready!");
        });
    </script>

</body>
</html>
