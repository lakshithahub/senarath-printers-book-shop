<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Inventory - Senarath Printers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #121212; /* Dark Background */
            --secondary: #1e1e1e; /* Card Background */
            --accent: #ffcc00; /* Vibrant Yellow */
            --accent-hover: #e6b800;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --danger: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--primary); color: var(--text-main); padding-bottom: 50px; }

        /* Navigation */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary); padding: 15px 40px; color: white;
            position: sticky; top: 0; z-index: 1000; 
            border-bottom: 2px solid var(--accent);
        }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: var(--text-dim); text-decoration: none; transition: 0.3s; font-weight: 500; font-size: 13px; }
        .nav-links a:hover { color: var(--accent); }

        /* Floating Logo */
        .logo-container { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .floating-logo {
            width: 70px; height: 70px; background: var(--accent);
            border: 3px solid #000; border-radius: 15px; padding: 3px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            animation: verticalFloat 3s ease-in-out infinite;
        }
        @keyframes verticalFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Header Section */
        .header-section { text-align: center; padding: 40px 20px 20px; }
        .title-text { color: var(--accent); font-size: 32px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
        .date-badge { background: var(--secondary); padding: 6px 16px; border-radius: 8px; display: inline-block; margin-top: 10px; font-size: 13px; color: var(--accent); border: 1px solid #333; }

        /* Stats Cards */
        .stats-container { display: flex; justify-content: center; gap: 20px; max-width: 1000px; margin: 0 auto 30px; padding: 0 20px; }
        .stat-card { background: var(--secondary); padding: 20px; border-radius: 12px; flex: 1; text-align: center; border: 1px solid #333; transition: 0.3s; }
        .stat-card:hover { border-color: var(--accent); }
        .stat-card h3 { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 1px; }
        .stat-card p { font-size: 26px; font-weight: 700; color: var(--accent); }

        /* Main Inventory Box */
        .inventory-box { max-width: 1000px; margin: 0 auto; background: var(--secondary); padding: 30px; border-radius: 16px; border: 1px solid #333; }
        
        .input-group { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; margin-bottom: 25px; }
        input { background: #2b2b2b; color: white; border: 1px solid #444; padding: 12px 15px; border-radius: 8px; outline: none; transition: 0.3s; font-size: 14px; }
        input:focus { border-color: var(--accent); background: #333; }
        ::placeholder { color: #666; }
        
        .add-btn { background: var(--accent); color: #000; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .add-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        /* Search Bar */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
        .search-container input { width: 100%; padding-left: 45px; background: #252525; border: 1px solid #333; }

        /* Table Design */
        .table-wrapper { overflow-x: auto; }
        .stocktable { width: 100%; border-collapse: collapse; }
        .stocktable th { background-color: #1a1a1a; color: var(--accent); padding: 15px; text-align: left; font-size: 12px; text-transform: uppercase; border-bottom: 2px solid #333; }
        .stocktable td { padding: 16px 15px; border-bottom: 1px solid #2a2a2a; font-size: 14px; color: var(--text-main); }
        .stocktable tr:hover { background-color: #252525; }

        .qty-badge { background: rgba(255, 204, 0, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 4px; font-weight: 700; border: 1px solid rgba(255, 204, 0, 0.2); }
        .del-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.7; transition: 0.2s; }
        .del-btn:hover { opacity: 1; transform: scale(1.1); }

        .btn-print { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 700; margin-top: 25px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-print:hover { background: var(--accent); color: #000; }

        /* Print Layout */
        @media print {
            .navbar, .logo-container, .input-group, .search-container, .btn-print, .action-col, .del-btn { display: none !important; }
            body { background: white; color: black; padding: 0; }
            .inventory-box { border: none; max-width: 100%; padding: 0; }
            .title-text { color: black; }
            .stocktable th { background: #eee !important; border: 1px solid #000; color: black; }
            .stocktable td { border: 1px solid #000; color: black; }
            .qty-badge { color: black; border: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-book-open" style="color: var(--accent); font-size: 22px;"></i>
            <span style="font-size: 18px; font-weight: 800; letter-spacing: 1px;">SENARATH PRINTERS</span>
        </div>
        <ul class="nav-links">
            <li><a href="#"><i class="fas fa-chart-line"></i> STATS</a></li>
            <li><a href="udara{sell inter fase}.html"><i class="fas fa-cash-register"></i> SALES</a></li>
            <li><a href="#" onclick="location.reload()"><i class="fas fa-redo"></i> RELOAD</a></li>
        </ul>
    </nav>

    <div class="logo-container">
        <div class="floating-logo">
            <img src="file:///C:/LAKSHITHA/test%20one/UDARA[LOGO].jpeg" alt="Logo" style="width: 100%; height: 100%; border-radius: 12px; object-fit: cover;">
        </div>
    </div>

    <div class="header-section">
        <p class="title-text">Stock Inventory</p>
        <div class="date-badge"><i class="far fa-calendar-alt"></i> <span id="currentDate"></span></div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Unique Items</h3>
            <p id="totalItemsCount">0</p>
        </div>
        <div class="stat-card">
            <h3>Total Value</h3>
            <p>Rs. <span id="totalStockValue">0.00</span></p>
        </div>
    </div>

    <div class="inventory-box">
        <div class="input-group">
            <input type="text" id="itemName" placeholder="Item Name (e.g. A4 Bundle)" autofocus>
            <input type="number" id="itemPrice" placeholder="Unit Price">
            <input type="number" id="itemQty" placeholder="Quantity">
            <button class="add-btn" onclick="updateStock()">ADD ITEM</button>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Quick find items..." onkeyup="filterStock()">
        </div>

        <div class="table-wrapper">
            <table class="stocktable">
                <thead>
                    <tr>
                        <th>Item Description</th>
                        <th>Unit Price</th>
                        <th>Available Stock</th>
                        <th class="action-col" style="text-align: center;">Manage</th>
                    </tr>
                </thead>
                <tbody id="stockBody"></tbody>
            </table>
        </div>

        <button class="btn-print" onclick="window.print()">
            <i class="fas fa-file-pdf"></i> PRINT INVENTORY REPORT
        </button>
    </div>

    <script>
        const STOCK_KEY = 'inventory_stock';

        window.onload = function() {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            renderStock();
            
            const inputs = ['itemName', 'itemPrice', 'itemQty'];
            inputs.forEach((id, index) => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        if (index < inputs.length - 1) document.getElementById(inputs[index+1]).focus();
                        else updateStock();
                    }
                });
            });
        };

        function updateStock() {
            let name = document.getElementById('itemName').value.trim();
            let price = parseFloat(document.getElementById('itemPrice').value);
            let qty = parseInt(document.getElementById('itemQty').value);

            if (!name || isNaN(price) || isNaN(qty)) {
                alert("Error: Please enter valid item details.");
                return;
            }

            let stock = JSON.parse(localStorage.getItem(STOCK_KEY)) || [];
            let existingItem = stock.find(item => item.name.toLowerCase() === name.toLowerCase());

            if (existingItem) {
                existingItem.qty += qty;
                existingItem.price = price;
            } else {
                stock.push({ name, price, qty });
            }

            localStorage.setItem(STOCK_KEY, JSON.stringify(stock));
            renderStock();
            
            document.getElementById('itemName').value = "";
            document.getElementById('itemPrice').value = "";
            document.getElementById('itemQty').value = "";
            document.getElementById('itemName').focus();
        }

        function deleteItem(index) {
            if (confirm("Remove this item from stock?")) {
                let stock = JSON.parse(localStorage.getItem(STOCK_KEY)) || [];
                stock.splice(index, 1);
                localStorage.setItem(STOCK_KEY, JSON.stringify(stock));
                renderStock();
            }
        }

        function filterStock() {
            let filter = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.getElementById('stockBody').getElementsByTagName('tr');
            
            for (let row of rows) {
                let name = row.getElementsByTagName('td')[0].textContent.toLowerCase();
                row.style.display = name.includes(filter) ? "" : "none";
            }
        }

        function renderStock() {
            let stock = JSON.parse(localStorage.getItem(STOCK_KEY)) || [];
            let tableBody = document.getElementById('stockBody');
            tableBody.innerHTML = "";

            let totalVal = 0;
            let itemCount = 0;

            stock.forEach((item, index) => {
                totalVal += (item.price * item.qty);
                itemCount++;
                
                tableBody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td style="font-weight: 600;">${item.name}</td>
                        <td style="color: var(--text-dim);">Rs. ${item.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        <td><span class="qty-badge">${item.qty}</span></td>
                        <td class="action-col" style="text-align: center;">
                            <button class="del-btn" onclick="deleteItem(${index})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `);
            });

            document.getElementById('totalItemsCount').innerText = itemCount;
            document.getElementById('totalStockValue').innerText = totalVal.toLocaleString(undefined, {minimumFractionDigits: 2});
        }
    </script>
</body>
</html>
